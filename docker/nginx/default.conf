# docker/nginx/default.conf
#
# Single entry point: public/index.php. Everything that is not a real file
# under public/ is routed to it.

server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php;

    charset utf-8;

    # Uploads are not a thing yet, but a stray huge request should not be
    # buffered to disk either.
    client_max_body_size 8m;

    # Do not advertise the nginx version.
    server_tokens off;

    # Basic hardening. The GUI has no frames, no external scripts and no
    # external styles, so the policy can be this strict.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets, served directly with a short cache. The stylesheet URL
    # carries a version derived from the file's mtime, so the browser cache
    # never holds back a change.
    location /assets/ {
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # Only index.php may be executed. Any other .php file under public/
    # returns 404 — if one ever lands there by accident, it stays inert.
    location ~ ^/index\.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Collection runs through the CLI, so a web request has no business
        # taking longer than this.
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    # Dotfiles (.env, .git) are not under the document root at all, but deny
    # them anyway in case someone changes the root later.
    location ~ /\. {
        deny all;
    }
}
