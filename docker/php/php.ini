; docker/php/php.ini
;
; Loaded as /usr/local/etc/php/conf.d/99-dcinfrasnap.ini
; (the 99 prefix means it comes after all the defaults).
;
; NOTE: this file is tuned for DEVELOPMENT. For production, change
; display_errors and opcache.validate_timestamps (both marked below).

[PHP]

; --- Time ----------------------------------------------------------
; Everything in the application works in UTC; conversion to local time
; happens only in the view.
date.timezone = UTC

; --- Errors --------------------------------------------------------
error_reporting = E_ALL

; DEVELOPMENT: errors are shown in the browser.
; PRODUCTION: display_errors = Off
display_errors = On
display_startup_errors = On

; Logging goes to the container's stderr, so "docker compose logs" sees it.
log_errors = On
error_log = /dev/stderr

; --- Limits --------------------------------------------------------
memory_limit = 256M

; Applies to web requests only. The CLI (collection, worker) has no such
; limit, which is exactly why collection runs through the CLI.
max_execution_time = 30
max_input_time = 30

post_max_size = 8M
upload_max_filesize = 8M

; --- Sessions ------------------------------------------------------
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Turn on once the application is served over HTTPS:
; session.cookie_secure = 1

; --- OPcache -------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; DEVELOPMENT: code changes are picked up immediately (bind mount).
; PRODUCTION: opcache.validate_timestamps = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; --- Misc ----------------------------------------------------------
; Do not advertise the PHP version in HTTP responses.
expose_php = Off
